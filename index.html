const parseD=s=>{const m=String(s).match(/(\d+)[-\s]+([A-Za-z]{3})\w*[-\s,]+(\d+)/);return m?new Date(m[3].length==2?2000+ +m[3]:+m[3],MO[m[2].toLowerCase()],+m[1]).getTime():0};

function csv(t){const R=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'){r.push(c);R.push(r);r=[];c=''}else if(ch!='\r')c+=ch}r.push(c);R.push(r);return R}
const ROUT=/uploaded|off market|closing rate|daily quotations|stock market report|kse 100 index|nd (accepted|rejected)|daily financial stats|research report/i;

/* Reads a Google Sheet tab through a script tag (JSONP), which avoids browser CORS blocks */
function gq(sid,sheet){return new Promise((res,rej)=>{
 const cb='gq'+Math.random().toString(36).slice(2),s=document.createElement('script');
 const cl=()=>{clearTimeout(t);delete window[cb];s.remove()},t=setTimeout(()=>{cl();rej('timeout')},15000);
 window[cb]=r=>{cl();if(!r||r.status!='ok')return rej('sheet error');
  res(r.table.rows.map(x=>(x.c||[]).map(c=>{if(!c)return'';let v=c.v;if(typeof v=='string'&&v.indexOf('Date(')==0)v=c.f;return v==null?'':v})))};
 s.onerror=()=>{cl();rej('blocked')};
 s.src='https://docs.google.com/spreadsheets/d/'+sid+'/gviz/tq?headers=0&tqx=out:json;responseHandler:'+cb+'&sheet='+encodeURIComponent(sheet);
 document.head.appendChild(s)})}

  if(!out.length)throw 0;NEWS=out;try{localStorage.setItem(NKEY,JSON.stringify(out))}catch(e){}

app.addEventListener('click',e=>{
 const t=e.target;
 if(t.dataset.mode){psxMode=t.dataset.mode;show('psx')}
 if(t.dataset.more){const l=t.previousElementSibling;l.classList.toggle('open');t.textContent=l.classList.contains('open')?'Show less':'+'+l.querySelectorAll('.x').length+' more'}
 if(t.dataset.nf){nf=t.dataset.nf;show('news')}
 if(t.id=='sn')syncNews();
 if(t.id=='so')syncOv();
 if(t.dataset.add){gp(t.dataset.add).push(t.dataset.add=='psx.hold'?{n:'NEW',nm:'New holding',s:'Other',q:0,a:0,p:0,d:0}:{n:'NEW',v:0});save();show('edit')}
 if(t.dataset.del){const ks=t.dataset.del.split('.'),i=+ks.pop();gp(ks.join('.')).splice(i,1);save();show('edit')}
 if(t.id=='sync'){const a=tot('fx',FX),b=tot('cr',CR),o=S.ov,cur=psxCur()+a.cur+b.cur;
  o.invested=Math.round(n(S.psx.invested)+a.inv+b.inv);o.net=Math.round(cur+o.idle);o.profit=Math.round(cur-o.invested);o.roi=+(o.invested?o.profit/o.invested*100:0).toFixed(2);save();show('edit')}
 if(t.id=='exp'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='portfolio.json';a.click()}
 if(t.id=='imp')$('#file').click();
 if(t.id=='rst'&&confirm('Reset all values to defaults?')){S=clone(DEF);save();show('edit')}
});
show(location.hash.slice(1)||'ov');
if(AUTO){syncOv(1);syncNews(1)}
</script>
</body>
</html>
