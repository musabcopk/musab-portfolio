 const cl=()=>{clearTimeout(t);delete window[cb];s.remove()},t=setTimeout(()=>{cl();rej('timeout')},15000);
 window[cb]=r=>{cl();if(!r||r.status!='ok')return rej('sheet error');
  res(r.table.rows.map(x=>(x.c||[]).map(c=>{if(!c)return'';let v=c.v;if(typeof v=='string'&&v.indexOf('Date(')==0)v=c.f;return v==null?'':v})))};
 s.onerror=()=>{cl();rej('blocked')};
 s.src='https://docs.google.com/spreadsheets/d/'+sid+'/gviz/tq?headers=0&tqx=out:json;responseHandler:'+cb+'&sheet='+encodeURIComponent(sheet);
 document.head.appendChild(s)})}

 const p=t.dataset.p;if(!p)return;
 const ks=p.split('.'),last=ks.pop(),o=ks.reduce((a,k)=>a[k],S);
 o[last]=t.type=='number'?n(t.value):t.value;save();
 if($('#pv'))$('#pv').innerHTML=prevHTML();
});
app.addEventListener('paste',e=>{if(e.target.isContentEditable){e.preventDefault();document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text'))}});
app.addEventListener('change',e=>{
 const t=e.target;
 if(t.id=='wsel'){wsel=+t.value;show('ov')}
 if(t.id=='tsel'){psxTbl=t.value;tq='';$('#tq').value='';setMsg('tm','');$('#tg').innerHTML=tblGrid()}
 if(t.id=='ss'){psxSort=t.value;$('#hb').innerHTML=rows()}
 if(t.id=='file'){const f=t.files[0];if(f)f.text().then(x=>{try{S=JSON.parse(x);save();show('edit')}catch(err){alert('That file is not valid JSON.')}})}
});
app.addEventListener('click',e=>{
 const t=e.target;
 if(t.dataset.mode){psxMode=t.dataset.mode;show('psx')}
 if(t.dataset.tadd!=null&&t.hasAttribute('data-tadd')){TB[psxTbl].r.push(Array(TB[psxTbl].h.length).fill(''));TB[psxTbl].dirty=true;saveT();$('#tg').innerHTML=tblGrid()}
 if(t.dataset.tdel!=null){TB[psxTbl].r.splice(+t.dataset.tdel,1);TB[psxTbl].dirty=true;saveT();$('#tg').innerHTML=tblGrid()}
 if(t.hasAttribute('data-tcsv'))dlCSV();
 if(t.hasAttribute('data-tlinks'))openLinks();
 if(t.hasAttribute('data-tsync')){if(!TB[psxTbl].dirty||confirm('Replace your edits in this table with the sheet data?')){TB[psxTbl].dirty=false;syncTbl(psxTbl)}}
 if(t.dataset.more){const l=t.previousElementSibling;l.classList.toggle('open');t.textContent=l.classList.contains('open')?'Show less':'+'+l.querySelectorAll('.x').length+' more'}
 if(t.dataset.nf){nf=t.dataset.nf;show('news')}
 if(t.id=='sn')syncNews();
 if(t.id=='so')syncOv();
 if(t.dataset.add){gp(t.dataset.add).push(t.dataset.add=='psx.hold'?{n:'NEW',nm:'New holding',s:'Other',q:0,a:0,p:0,d:0}:{n:'NEW',v:0});save();show('edit')}
 if(t.dataset.del){const ks=t.dataset.del.split('.'),i=+ks.pop();gp(ks.join('.')).splice(i,1);save();show('edit')}
 if(t.id=='sync'){const a=tot('fx',FX),b=tot('cr',CR),o=S.ov,cur=psxCur()+a.cur+b.cur;
  o.invested=Math.round(n(S.psx.invested)+a.inv+b.inv);o.idle=Math.round(n(S.alloc.cash));o.net=Math.round(Object.values(S.alloc).reduce((x,y)=>x+n(y),0));o.profit=Math.round(cur-o.invested);o.roi=+(o.invested?o.profit/o.invested*100:0).toFixed(2);save();show('edit')}
 if(t.id=='exp'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='portfolio.json';a.click()}
 if(t.id=='imp')$('#file').click();
 if(t.id=='rst'&&confirm('Reset all values to defaults?')){S=clone(DEF);save();show('edit')}
});
show(location.hash.slice(1)||'ov');
if(AUTO){syncOv(1);syncNews(1);TL.forEach(k=>syncTbl(k,1))}
</script>
